name: Build Anikku armeabi-v7a APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: false
        default: 'v7a-latest'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build armeabi-v7a APK (R8 + debug-signed)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # v4.2.2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run Spotless
        run: ./gradlew spotlessApply --no-daemon

      - name: Write debug keystore
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Build preview APK (armeabi-v7a, full-mode R8, debug-signed)
        env:
          CI: true
        run: |
          ./gradlew assemblePreview \
            -Pandroid.enableR8.fullMode=true \
            -Pandroid.testCoverageEnabled=false \
            -Pinclude-telemetry \
            -Penable-updater \
            -Pinclude-dependency-info \
            -PenableComposeCompilerMetrics=true \
            -PenableComposeCompilerReports=true \
            --no-daemon \
            --stacktrace \
            -x lint \
            -x test \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Find and rename armeabi-v7a APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print | grep -Ei 'armeabi-v7a|armeabi_v7a' | head -1 || true)"
          if [ -z "$APK" ]; then
            echo 'No armeabi-v7a APK was produced. Available APKs:'
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          TAG="${{ inputs.tag_name }}"
          DEST="Anikku1-armeabi-v7a-${TAG}.apk"
          cp "$APK" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "size=$(du -sh "$DEST" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Found: $APK -> $DEST"

      - name: Collect R8 and Compose reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p r8-report
          if [ -d app/build/outputs/mapping ]; then
            cp -R app/build/outputs/mapping/. r8-report/
          fi
          if [ -d build/compose-reports ]; then
            cp -R build/compose-reports/. r8-report/compose-reports/
          fi
          {
            echo "R8 full mode: enabled"
            echo "Variant: preview"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Generated report files:"
            find r8-report -type f -print | sort
          } > r8-report/README.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Anikku1-armeabi-v7a-${{ inputs.tag_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload R8 report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Anikku1-r8-report-${{ inputs.tag_name }}
          path: r8-report
          if-no-files-found: warn
          retention-days: 7

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name }}"
          APK="${{ steps.apk.outputs.apk }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "Anikku $TAG (armeabi-v7a, R8 full mode, debug-signed)" \
              --notes "Anikku armeabi-v7a preview build with full-mode R8 and debug signing." \
              --prerelease
          fi
