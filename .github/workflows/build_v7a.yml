name: Build Anikku armeabi-v7a APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: false
        default: 'v7a-latest'

permissions:
  contents: write

jobs:
  build:
    name: Build armeabi-v7a APK (R8 + debug-signed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Write debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Build preview APK (armeabi-v7a, R8, debug-signed)
        env:
          CI: true
        run: |
          ./gradlew assemblePreview \
            -Pandroid.enableR8.fullMode=false \
            -Pandroid.testCoverageEnabled=false \
            --no-daemon \
            -x lint \
            -x test \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Find and rename APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -path "*/preview/*" | grep -i "armeabi-v7a\|preview" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" | head -1)
          fi
          TAG="${{ github.event.inputs.tag_name }}"
          DEST="Ankku1-armeabi-v7a-${TAG}.apk"
          cp "$APK" "$DEST"
          echo "apk=$DEST" >> $GITHUB_OUTPUT
          echo "size=$(du -sh $DEST | cut -f1)" >> $GITHUB_OUTPUT
          echo "Found: $APK → $DEST"

      - name: Show R8 mapping size
        run: |
          find . -name "mapping.txt" 2>/dev/null | head -3 | xargs ls -lh 2>/dev/null || echo "No mapping.txt found"

      - name: Create release and upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          APK="${{ steps.apk.outputs.apk }}"
          if gh release view "\( TAG" --repo " \){{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "Ankku1 – $TAG (armeabi-v7a, R8, debug-signed)" \
              --notes "Anikku armeabi-v7a build" \
              --prerelease
          fi
